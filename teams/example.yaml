# A team definition for factory.sh. Copy this file to teams/team.yaml (the default) or anywhere
# else and edit it, then:
#
#   ./factory.sh check                     validate the file and show where everything will live
#   ./factory.sh up                        start the team
#   ./factory.sh -c path/to/other.yaml up  use a different file (or set TEAM_CONFIG)
#
# To change the team dynamics: add, remove or reorder roles, change the prompts, models or
# storage. Unknown keys are errors, so a typo cannot silently fall back to a default.
# Relative paths below are relative to this file. A leading ~ is the home directory.

team: example                 # names the state folder (.state/<team>/) and appears in prompts
owner: Your Name              # the human the team works for; named in the prompts

# The project: the local checkout, its GitHub repo, and the GitHub Project (board) the team
# tracks work on. The prompts name these, so this is the only edit to retarget a team.
repo:
  path: /path/to/your/checkout
  github: owner/name            # origin must contain this before a worktree is created
  base: origin/main             # new worktrees start detached here
  # The repo's pass/fail command (run with bash in the seat's working tree). A role with
  # `gate_on_stop: true` runs it as a Stop hook whenever it ends a turn with uncommitted changes,
  # and is sent back to work with the failure. After gate_max_blocks failed gates in a row the stop
  # goes through (a seat also stops to wait for an answer or a review). The hook runs inside the
  # seat's tmux session, so a gate that must not touch tmux unsets TMUX itself. It runs at every
  # such stop, so a slow gate makes those stops slow.
  gate: "make test"
  # gate_timeout: 600           # seconds; the gate and everything it started are then killed
  # gate_max_blocks: 3

project:
  name: Your Project Board
  url: https://github.com/users/your-login/projects/1

# Where worktrees live. Every role with `workdir.type: worktree` is created under
# <volume>/<root>/. The volume must be a mounted volume (checked from the mount table, at the
# moment a worktree is created); the launcher never falls back to another disk.
storage:
  volume: /Volumes/YourDrive
  root: Projects/example-worktrees

sessions:
  prefix: example             # tmux session name is <prefix>-<role id> unless a role sets `session`
  claude:
    # Optional program that runs claude, for example an app that holds macOS privacy grants
    # (Downloads, removable volumes) that a seat started from tmux would otherwise lack. It is
    # called as: <wrapper> <path to claude> <args...>. Leave unset to run claude directly. If it
    # is set but the file is missing, claude runs directly.
    # wrapper: ~/Applications/SomeWrapper.app/Contents/MacOS/SomeWrapper
    # Extra claude flags, one per list item. Flags factory.sh sets itself (--settings,
    # --setting-sources, --permission-prompt-tool) are refused here, and so are permission flags
    # when permission_mode is set.
    # args: []
    # Load the factory's own plugin (plugin/ next to factory.sh) into every seat with --plugin-dir.
    # Its skills show as /factory:<skill>, and only sessions factory.sh starts get them. Default true,
    # so a team file without this key gets the plugin at its next `up`, and gets every skill (and,
    # later, every hook) added to plugin/ after that. false: the flag is omitted. A --plugin-dir of
    # your own in args still loads; the flag repeats.
    # plugin: true
    # Permission mode for every seat (a role can override it): default (alias manual) |
    # acceptEdits | plan | auto | dontAsk | bypassPermissions. auto runs without routine prompts
    # and has a classifier check risky actions. bypassPermissions skips every prompt and is meant
    # for an isolated machine only; the deny and ask rules below still hold in it, and an ask rule
    # leaves the seat waiting until someone answers. Unset: the flag is omitted and the seat uses
    # permissions.defaultMode from ~/.claude/settings.json.
    permission_mode: auto
    # permission_mode: bypassPermissions
    # Model and effort for every seat (a role can override either). Left unset, the flag is
    # omitted and each seat inherits `model` and `effortLevel` from ~/.claude/settings.json.
    # model takes an alias or a full id; effort is low | medium | high | xhigh | max. Effort is the
    # main cost and depth control: medium suits coordination, high subtle work, and max only a hard
    # problem a seat works on unattended, such as a security hunt. The roles below set their own.
    # model: opus
    # effort: high

# What `up` shows once the seats are running, and what `./factory.sh view` shows any time: a new
# iTerm tab with every running seat in a pane. The primary seat is on the left at the full height
# of the tab (it is the one you talk to); the others are in rows on the right, two per row, and
# an odd last seat gets a full-width row. Needs iTerm2 and, the first time, macOS Automation
# permission for the program running factory.sh to control iTerm.
display:
  iterm: true                 # false: do not open the tab (up --no-view skips it once)
  primary: em                 # role id shown on the left; default is the first role
  window: full                # full: size the window to the usable area of its screen (not the
                              # menu bar or Dock); keep: leave the window size alone

prompts:
  common: ../roles/common.md   # prepended to every seat's prompt. Placeholders: @@TEAM@@ @@OWNER@@
                               # @@TITLE@@ @@ROLE@@ @@SESSION@@ @@PREFIX@@ @@SCRIPT@@ @@LOG@@ @@REPO@@
                               # @@GITHUB_REPO@@ @@GITHUB_URL@@ @@PROJECT_NAME@@ @@PROJECT_URL@@
                               # @@WORKDIR@@ @@WORKTREE_ROOT@@ @@VOLUME@@ @@ROSTER@@ @@GATE_MAX_BLOCKS@@
                               # @@NOTE@@ (the seat's progress note, <state>/notes/<role>.md)

# First message typed into a seat at startup (a role can override it with its own `kickoff`).
kickoff: >-
  Team session started: you are the @@TITLE@@ (session @@SESSION@@). Your full role
  instructions are in your system prompt. Reply with one line confirming your role and working
  directory (and, if your progress note names a task, that task and its next step), then wait for
  a message from the EM or @@OWNER@@. Do not start any work until you receive one.

# Permission rules for every seat, merged with each role's own `permissions:` (team first). Each
# seat gets them in a generated settings file (<state>/settings/<role>.json, passed with
# --settings), on top of the rules in ~/.claude/settings.json and the repo's .claude/ settings.
# Claude Code checks deny, then ask, then allow, and the first match wins, so a role can add or
# tighten a rule but never loosen a team one. Syntax: https://code.claude.com/docs/en/permissions
# - Bash rules match the command text: another spelling (`git -C . push`, a script, `sh -c`) is
#   not caught. These rules are an accident guard, not a security boundary (#29 tracks making
#   them one). The sandbox would hold whatever the command text, but factory.sh does not turn it on.
# - Paths: //absolute, ~/home, ./relative or a bare name. A single leading / would anchor at the
#   state folder that holds the generated file, so it is refused.
# factory.sh adds two sets itself: an Edit deny on the files that change a seat's next start (team
# file, prompts, launcher, generated state, Claude Code's own settings), and an ask on any push to
# the base branch (from repo.base). `./factory.sh check` lists what each seat gets.
permissions:
  deny:
    # Every .env on the machine, the main checkout's included. This also blocks .env.example: a
    # ! pattern cannot carve an exception out of a // rule.
    - Read(//**/.env)
    - Read(//**/.env.*)
  ask:
    # Merging a PR is the owner's (or, when told, the EM's) step. Every role but em denies it
    # outright below; this ask covers a role added later without rules of its own.
    - Bash(gh pr merge *)
    - Bash(gh api *pulls/*/merge*)
    - Bash(gh api graphql*mergePullRequest*)

# Seats start in this order. Each needs: title, workdir, and one of `prompt` (a file) or
# `prompt_text` (inline). `summary` is the line shown in the roster every seat sees.
# Each seat costs tokens while it works, so start only the seats a task needs: README, "Right-sizing".
# Optional per role: `gate_on_stop:` (see repo.gate), `model:`, `effort:` and `permission_mode:` (override sessions.claude),
# `permissions:` (added to the team's), `session:` (tmux name), `kickoff:` (first message),
# `skills:` (skills to name in the seat's prompt, below), `may_merge:` (below).
# may_merge: true marks a role that is meant to merge PRs (on the owner's say-so). It is a YAML
# boolean, so an unquoted yes or on also reads as true. `check` warns about every other role whose
# rules have neither a deny nor an ask on each merge pattern above, so a team that drops the
# team-wide ask learns which roles are left open. It changes no rule.
# skills: each item is a skill name as the Skill tool shows it (`name`, or `plugin:name` for a
# plugin's skill), or a one-entry mapping of that name to when to use it. They are listed after the
# role's prompt with a note that a skill may not be installed, so naming one installs nothing and
# a seat without it works on. The ones below come from the superpowers plugin and Claude Code's own
# bundled skills: keep the ones you have, add your own.
#   workdir.type: project   an existing folder: path: ...
#   workdir.type: worktree  a git worktree under storage (optional: name: folder-name)
roles:
  em:
    title: Engineering Manager
    effort: medium
    summary: owns the board, assigns work, the owner's single contact
    workdir: { type: project, path: /path/to/your/checkout }
    prompt: ../roles/em.md
    skills:
      - "superpowers:brainstorming": to pin down a vague request from the owner before filing issues
      - "factory:assign": to hand one issue to one seat with a complete brief
    permissions:
      # Ask before a force-push. Engineers keep force-pushing their own branches unattended (they
      # rebase); "never force-push a branch you did not create" cannot be written as a pattern.
      ask: ["Bash(git push --force*)", "Bash(git push -f*)", "Bash(git push * --force*)", "Bash(git push * -f*)", "Bash(git push * +*)"]
    kickoff: >-
      Team session started: you are the @@TITLE@@ (session @@SESSION@@). Your full role
      instructions are in your system prompt. Reply with one line confirming your role and
      working directory (and, if your progress note names a task, that task and its next step),
      then wait for @@OWNER@@. Do not message teammates or start work until they give you
      something to do.
  tl:
    title: Tech Lead
    effort: high
    summary: design direction, reviews every PR
    workdir: { type: worktree }
    prompt: ../roles/tl.md
    skills:
      - "code-review": to review a PR's diff for correctness bugs
      - "superpowers:writing-plans": to turn an agreed design into steps an engineer can follow
    permissions: { deny: ["Bash(gh pr merge *)", "Bash(gh api *pulls/*/merge*)", "Bash(gh api graphql*mergePullRequest*)"] }
  fs1:
    title: Senior Full-Stack Software Engineer
    effort: high
    summary: implements assigned issues
    workdir: { type: worktree }
    prompt: ../roles/fs.md
    gate_on_stop: true
    skills:
      - "superpowers:test-driven-development": before writing implementation code
      - "superpowers:systematic-debugging": on a bug or a failing test, before proposing a fix
      - "superpowers:verification-before-completion": before saying work is done or opening a PR
      - "superpowers:receiving-code-review": before acting on review comments
    permissions: { deny: ["Bash(gh pr merge *)", "Bash(gh api *pulls/*/merge*)", "Bash(gh api graphql*mergePullRequest*)"] }
  fs2:
    title: Senior Full-Stack Software Engineer
    effort: high
    summary: implements assigned issues
    workdir: { type: worktree }
    prompt: ../roles/fs.md
    gate_on_stop: true
    skills:
      - "superpowers:test-driven-development": before writing implementation code
      - "superpowers:systematic-debugging": on a bug or a failing test, before proposing a fix
      - "superpowers:verification-before-completion": before saying work is done or opening a PR
      - "superpowers:receiving-code-review": before acting on review comments
    permissions: { deny: ["Bash(gh pr merge *)", "Bash(gh api *pulls/*/merge*)", "Bash(gh api graphql*mergePullRequest*)"] }
  qa:
    title: QA Engineer
    effort: high
    summary: verifies behaviour, owns regression coverage
    workdir: { type: worktree }
    prompt: ../roles/qa.md
    gate_on_stop: true
    skills:
      - "superpowers:verification-before-completion": before reporting a result
      - "superpowers:systematic-debugging": when a behaviour is not what the issue says
      - "run": to start the app and see a change working
    permissions: { deny: ["Bash(gh pr merge *)", "Bash(gh api *pulls/*/merge*)", "Bash(gh api graphql*mergePullRequest*)"] }
  sec:
    title: Security Engineer
    effort: high
    summary: security review and triage
    workdir: { type: worktree }
    prompt: ../roles/sec.md
    skills:
      - "security-review": to review a branch's pending changes for security issues
    permissions: { deny: ["Bash(gh pr merge *)", "Bash(gh api *pulls/*/merge*)", "Bash(gh api graphql*mergePullRequest*)"] }
